<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Profil Pribadi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<style>
        :root {
            --bg-color: #ffffff;
            --text-main: #334155;
            --text-light: #64748b;
            --accent: #3b82f6;
            --border-color: #e2e8f0;
            --hover-bg: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
        }

        .profile-header {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            margin-bottom: 4rem;
        }

        @media (min-width: 640px) {
            .profile-header {
                flex-direction: row;
                align-items: center;
            }
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #f1f5f9;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }

        .profile-info p {
            font-size: 2rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0.25rem;
        }

        .profile-nim {
            font-size: 1rem;
            color: var(--accent);
            font-weight: 500;
            margin-bottom: 1rem;
        }

        .hobi-section {
            margin-top: 1rem;
        }

        .hobi-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-light);
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: block;
        }

        .hobi-list {
            list-style: none;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .hobi-tag {
            background: #f1f5f9;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.875rem;
            color: var(--text-main);
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #0f172a;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 4rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9375rem;
        }

        th {
            text-align: left;
            padding: 0.75rem 0;
            color: var(--text-light);
            font-weight: 500;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 1rem 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .form-container {
            max-width: 500px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .input-text {
            width: 100%;
            padding: 0.625rem;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            font-family: inherit;
            font-size: 0.9375rem;
            transition: border-color 0.2s;
        }

        .input-text:focus {
            outline: none;
            border-color: var(--accent);
        }

        .selection-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .selection-item {
            display: flex;
            align-items: center;
            font-size: 0.9375rem;
            cursor: pointer;
        }

        .selection-item input {
            margin-right: 0.5rem;
        }

        .btn-submit {
            background-color: var(--accent);
            color: white;
            padding: 0.625rem 1.5rem;
            border-radius: 0.375rem;
            border: none;
            font-weight: 500;
            font-size: 0.9375rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .mb-2 { margin-bottom: 0.5rem; }
</style>
</head>
<body>
<div class="container">

    <header class="profile-header">
    <div class="profile-image-container">
        <img src="Batman.jpg" alt="Profile" class="profile-image" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23cbd5e1'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E"/>
    </div>

    <div class="profile-info">
        <p>M.Wahyu Firmansyah<p>
        <p class="profile-nim">NIM 246250045</p>
        <div class="hobi-section">
            <p><span class="hobi-label">Minat &amp; Hobi</span></p>
            <div class="hobi-list">
                <ul>
                    <li class="hobi-tag">Membaca Buku</li>
                    <li class="hobi-tag">Olahraga Lari</li>
                    <li class="hobi-tag">Mendengar Musik</li>
                </ul>
            </div>
        </div>
    </div>
    </header>

    <section>
        <h2 class="section-title">Informasi Dasar</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Identitas</th>
                        <th>Detail</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Nama</td>
                        <td>Nama Kamu</td>
                    </tr>
                    <tr>
                        <td>Tanggal Lahir</td>
                        <td>1 Januari 2000</td>
                    </tr>
                    <tr>
                        <td>Alamat</td>
                        <td>Jl. Contoh No. 123, Kota</td>
                    </tr>
                    <tr>
                        <td>Email</td>
                        <td>nama@email.com</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="form-container">
        <h2 class="section-title">Hubungi Saya</h2>
        <form action="#" method="post">
            <div class="form-group">
                <label class="label">Nama Lengkap</label>
                <input class="input-text" name="nama" placeholder="Masukkan nama anda" type="text"/>
            </div>
            <div class="form-group">
                <label class="label">Email</label>
                <input class="input-text" name="email" placeholder="email@contoh.com" type="email"/>
            </div>
            <div class="form-group">
                <label class="label">Jenis Kelamin</label>
                <div class="selection-group">
                    <label class="selection-item">
                    <input name="gender" type="radio" value="Laki-laki"/> Laki-laki
                    </label>
                    <label class="selection-item">
                    <input name="gender" type="radio" value="Perempuan"/> Perempuan
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label class="label">Hobi yang Sama</label>
                <div class="selection-group">
                    <label class="selection-item">
                    <input name="hobi" type="checkbox" value="Membaca"/> Membaca
                    </label>
                    <label class="selection-item">
                    <input name="hobi" type="checkbox" value="Olahraga"/> Olahraga
                    </label>
                    <label class="selection-item">
                    <input name="hobi" type="checkbox" value="Musik"/> Musik
                    </label>
                </div>
            </div>
            <button class="btn-submit" type="submit">Kirim Pesan</button>
        </form>
    </section>
</div>
</body>
</html>
